<div class="auth-panel auth-login-panel">
  <div class="auth-panel-brand">
    <img
      class="auth-panel-logo"
      src="/assets/marca/logo-morelia-auth.svg"
      alt="Morelia"
    />
  </div>

  <p class="auth-copy auth-copy--brand">
    Crea tu cuenta o inicia sesión.
  </p>

  <form id="auth-login-form" class="auth-form" novalidate>
    <label class="auth-field auth-register-only" for="auth-name" data-auth-register-only>
      <span>Nombre</span>
      <input
        type="text"
        id="auth-name"
        name="name"
        placeholder="Tu nombre"
        autocomplete="name"
        maxlength="100"
      />
    </label>

    <label class="auth-field" for="auth-email">
      <span>Correo electrónico</span>
      <input
        type="email"
        id="auth-email"
        name="email"
        placeholder="tu@email.com"
        inputmode="email"
        autocomplete="email"
        autocapitalize="none"
        spellcheck="false"
        maxlength="100"
        required
      />
    </label>

    <label class="auth-field auth-register-only" for="auth-country" data-auth-register-only>
      <span>País</span>
      <select
        id="auth-country"
        name="country"
        autocomplete="country"
      >
        <option value="">Selecciona tu país</option>
      </select>
    </label>

    <label class="auth-field" for="auth-password">
      <span>Contraseña</span>

      <div class="password-wrapper">
        <input
          type="password"
          id="auth-password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          minlength="6"
          maxlength="60"
          spellcheck="false"
          required
          aria-describedby="auth-message"
        />

        <button
          type="button"
          class="toggle-password-btn"
          data-auth-action="toggle-password"
          aria-label="Mostrar contraseña"
          aria-pressed="false"
        >
          <i data-lucide="eye-off" aria-hidden="true"></i>
        </button>
      </div>
    </label>

    <p
      id="auth-message"
      class="auth-message"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>

    <div class="auth-actions">
      <button
        type="submit"
        class="auth-btn auth-btn-primary btn-primary"
        data-auth-action="login"
      >
        Iniciar sesión
      </button>

      <button
        type="button"
        class="auth-btn auth-btn-secondary btn-secondary"
        data-auth-action="signup"
      >
        Registrarse
      </button>
    </div>

   <!-- <button
      type="button"
      class="auth-recover-btn"
      data-auth-action="recover"
    >
      ¿Olvidaste tu contraseña?
    </button> -->
  </form>
</div>
