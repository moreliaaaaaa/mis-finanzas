<div id="vista-perfil" data-vista="perfil" class="hidden">
  <section class="page-header">
    <div class="page-header-content">
      <button
        type="button"
        class="btn-back"
        onclick="window.cambiarVista('home')"
      >
        <i data-lucide="arrow-left"></i>
        Volver al panel
      </button>
      <h1 class="section-title">Perfil</h1>
      <p class="section-subtitle">
        Configura tu cuenta y tus preferencias personales.
      </p>
    </div>
  </section>

  <div class="main-layout">
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <i data-lucide="user" class="asset-icon panel-title-icon"></i>
          <span>Mi cuenta</span>
        </div>
      </div>

      <div class="profile-card-summary">
        <div class="profile-avatar-badge" id="profile-avatar-badge">MF</div>
        <div>
          <h3 id="profile-user-name">Mi perfil</h3>
          <p id="profile-user-email">Usuario de Morelia Finanzas</p>
        </div>
      </div>

      <div class="panel" id="profile-edit-panel" hidden>
        <div class="panel-header">
          <div class="panel-title">
            <i data-lucide="edit" class="asset-icon panel-title-icon"></i>
            <span>Editar mi información</span>
          </div>
        </div>

        <form id="profile-edit-form" novalidate>
          <div class="profile-photo-upload">
            <div
              class="profile-avatar-badge profile-avatar-badge--lg"
              id="profile-edit-avatar"
            >
              MF
            </div>
            <div class="profile-photo-actions">
              <label class="btn-secondary" for="profile-photo-input">
                Subir foto
              </label>
              <input
                type="file"
                id="profile-photo-input"
                accept="image/*"
                hidden
              />
              <button
                type="button"
                id="profile-photo-remove"
                class="btn-secondary"
              >
                Quitar foto
              </button>
            </div>
          </div>

          <label class="profile-edit-field" for="profile-edit-name">
            <span>Nombre</span>
            <input
              type="text"
              id="profile-edit-name"
              name="name"
              placeholder="Tu nombre"
              autocomplete="name"
              maxlength="100"
              required
            />
          </label>

          <label class="profile-edit-field" for="profile-edit-email">
            <span>Correo electrónico</span>
            <input
              type="email"
              id="profile-edit-email"
              name="email"
              autocomplete="email"
              disabled
            />
          </label>

          <div class="profile-edit-actions">
            <button type="submit" class="btn-primary">Guardar cambios</button>
            <button
              type="button"
              id="profile-edit-cancel"
              class="btn-secondary"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>

      <div class="profile-options">
        <div class="profile-option-row">
          <span>Iniciar limpio</span>
          <button
            type="button"
            id="profile-reset-data-btn"
            class="btn-secondary"
          >
            Borrar todo
          </button>
        </div>

        <div class="profile-option-row">
          <span>Modo oscuro</span>
          <button type="button" id="profile-theme-toggle" class="btn-secondary">
            Activar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Mi información</span>
          <button
            type="button"
            id="profile-edit-info-btn"
            class="btn-secondary"
          >
            Editar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Seguridad</span>
          <button type="button" class="btn-secondary" disabled>Cambiar</button>
        </div>

        <div class="profile-option-row">
          <span>Notificaciones</span>
          <button type="button" class="btn-secondary" disabled>
            Configurar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Sincronización</span>
          <button type="button" class="btn-secondary" disabled>
            Configurar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Preferencias</span>
          <button type="button" class="btn-secondary" disabled>Ver más</button>
        </div>

        <button type="button" id="profile-logout-btn" class="btn-primary">
          Cerrar sesión
        </button>
      </div>
    </section>
  </div>
</div>
