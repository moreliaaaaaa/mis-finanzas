<div id="vista-perfil" data-vista="perfil" class="hidden">
  <div class="main-layout profile-layout">
    <section class="panel profile-panel">
      <div class="panel-header profile-panel-header">
        <div class="panel-title-row">
          <button
            type="button"
            class="btn-back"
            onclick="window.irAHome()"
            aria-label="Volver al inicio"
            title="Volver al inicio"
          >
            <i data-lucide="arrow-left" aria-hidden="true"></i>
          </button>

          <div class="profile-panel-title">
            <i
              data-lucide="user"
              class="profile-panel-title-icon"
              aria-hidden="true"
            ></i>
            <h1>Perfil</h1>
          </div>
        </div>
      </div>

      <div class="profile-card-summary">
        <div class="profile-avatar-badge" id="profile-avatar-badge">MF</div>
        <div class="profile-summary-copy">
          <h3 id="profile-user-name">Mi perfil</h3>
          <p id="profile-user-email">Usuario de Morelia Finanzas</p>
        </div>
      </div>

      <div class="panel profile-edit-panel" id="profile-edit-panel" hidden>
        <div class="panel-header">
          <div class="panel-title">
            <i data-lucide="edit" class="asset-icon panel-title-icon"></i>
            <span>Editar mi informaci&oacute;n</span>
          </div>
        </div>

        <form id="profile-edit-form" novalidate>
          <div class="profile-photo-upload">
            <div
              class="profile-avatar-badge profile-avatar-badge--lg"
              id="profile-edit-avatar"
            >
              MF
            </div>
            <div class="profile-photo-actions">
              <button type="button" class="btn-secondary profile-photo-select" id="profile-photo-select">
                Subir foto
              </button>
              <input
                type="file"
                id="profile-photo-input"
                aria-label="Foto de perfil"
                accept="image/*"
                hidden
              />
              <button
                type="button"
                id="profile-photo-remove"
                class="btn-secondary"
              >
                Quitar foto
              </button>
            </div>
          </div>

          <label class="profile-edit-field" for="profile-edit-name">
            <span>Nombre</span>
            <input
              type="text"
              id="profile-edit-name"
              name="name"
              placeholder="Tu nombre"
              autocomplete="name"
              maxlength="100"
              required
            />
          </label>

          <label class="profile-edit-field" for="profile-edit-email">
            <span>Correo electr&oacute;nico</span>
            <input
              type="email"
              id="profile-edit-email"
              name="email"
              autocomplete="email"
              disabled
            />
          </label>

          <div class="profile-edit-actions">
            <button type="submit" class="btn-primary">Guardar cambios</button>
            <button
              type="button"
              id="profile-edit-cancel"
              class="btn-secondary"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>

      <div class="profile-options">
        <div class="profile-option-row">
          <span>Iniciar limpio</span>
          <button
            type="button"
            id="profile-reset-data-btn"
            class="btn-secondary"
          >
            Borrar todo
          </button>
        </div>

        <div class="profile-option-row">
          <span>Modo oscuro</span>
          <button type="button" id="profile-theme-toggle" class="btn-secondary">
            Activar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Mi informaci&oacute;n</span>
          <button
            type="button"
            id="profile-edit-info-btn"
            class="btn-secondary"
          >
            Editar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Seguridad</span>
          <button type="button" class="btn-secondary" disabled>Cambiar</button>
        </div>

        <div class="profile-option-row">
          <span>Notificaciones</span>
          <button type="button" class="btn-secondary" disabled>
            Configurar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Sincronizaci&oacute;n</span>
          <button type="button" class="btn-secondary" disabled>
            Configurar
          </button>
        </div>

        <div class="profile-option-row">
          <span>Preferencias</span>
          <button type="button" class="btn-secondary" disabled>Ver m&aacute;s</button>
        </div>

        <button type="button" id="profile-logout-btn" class="btn-primary">
          Cerrar sesi&oacute;n
        </button>
      </div>
    </section>
  </div>
</div>
