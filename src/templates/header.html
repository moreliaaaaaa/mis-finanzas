<header>
  <div class="navbar-container">
    <div class="navbar-actions">
      <div class="nav-dropdown">
        <button
          id="nav-menu-btn"
          class="btn-icon menu-button"
          title="Abrir menú"
          aria-expanded="false"
          aria-controls="nav-menu"
        >
          <i data-lucide="menu"></i>
        </button>
      </div>
    </div>

    <div class="navbar-brand">
      <div class="navbar-brand-identity">
        <img
          class="navbar-logo-brand"
          src="/assets/marca/logo-morelia.svg"
          alt="Morelia Finanzas">
      </div>

    </div>

    <div class="navbar-home-greeting" aria-live="polite">
      Hola. <span id="header-user-name">Usuario</span>
    </div>

  </div>
</header>
<div id="nav-backdrop" class="nav-backdrop" hidden></div>
<aside
  id="nav-menu"
  class="dropdown-menu"
  aria-hidden="true"
  aria-label="Menú principal"
>
  <div class="dropdown-header">
    <div class="dropdown-brand">
      <img
        class="dropdown-brand-logo"
        src="/assets/marca/logo-morelia.svg"
        alt="Morelia Finanzas"
      />
    </div>
    <button
      type="button"
      class="dropdown-close"
      aria-label="Cerrar menú"
      title="Cerrar menú"
    >
      <i data-lucide="x"></i>
    </button>
  </div>
  <div class="dropdown-links">
    <button
      type="button"
      class="dropdown-item active"
      data-nav-view="home"
      aria-current="page"
      onclick="window.irAHome()"
    >
      <i data-lucide="home"></i>
      <span>Inicio</span>
    </button>
    <button
      type="button"
      class="dropdown-item"
      data-nav-view="registro"
      onclick="window.irARegistro()"
    >
      <i data-lucide="plus-circle"></i>
      <span>Registro de movimiento</span>
    </button>
    <button
      type="button"
      class="dropdown-item"
      data-nav-view="ultimos"
      onclick="window.irAUltimos()"
    >
      <i data-lucide="list"></i>
      <span>Últimos movimientos</span>
    </button>
    <button
      type="button"
      class="dropdown-item"
      data-nav-view="egresos"
      onclick="window.irAEgresos()"
    >
      <i data-lucide="bar-chart-3"></i>
      <span>Distribución de egresos</span>
    </button>
    <button
      type="button"
      class="dropdown-item"
      data-nav-view="historial-periodos"
      onclick="window.irAHistorialPeriodos()"
    >
      <i data-lucide="calendar"></i>
      <span>Historial de periodos</span>
    </button>
    <button
      type="button"
      class="dropdown-item"
      data-nav-view="presupuesto"
      onclick="window.irAPresupuesto()"
    >
      <i data-lucide="wallet"></i>
      <span>Presupuesto</span>
    </button>
    <button
      type="button"
      class="dropdown-item"
      data-nav-view="perfil"
      onclick="window.irAPerfil()"
    >
      <i data-lucide="user"></i>
      <span>Perfil</span>
    </button>
  </div>
</aside>
